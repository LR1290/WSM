services:
  - type: web
    name: waspeed-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: BASE_URL
        value: https://ws.onrender.com
      - key: DATA_DIR
        value: ./data
      - key: PERSIST_MODE
        value: debounced
      - key: SAVE_DEBOUNCE_MS
        value: 1500
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ACCESS_TOKEN
        value: ffce211a-7b07-4d91-ba5d-c40bb4034a83
      - key: CHROME_STORE_ID
        value: balkfdkhbcjjmhndnblgmlmcabnapogp
      - key: INSTALL_URL
        value: https://web.whatsapp.com
      - key: NOTES_REDIRECT
        value: "false"
